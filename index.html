<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102a43"><link rel="manifest" href="manifest.webmanifest"><title>kasam.net · Ön Muhasebe</title><style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#102a43;--muted:#62748a;--line:#dce5ef;--blue:#1769e0;--green:#138a5b;--red:#c93c4b;--gold:#c48620;--nav:#102a43}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 13px;font-weight:700}.primary{background:var(--blue);color:#fff}.secondary{background:#edf3fb;color:var(--ink);border:1px solid var(--line)}.danger{background:var(--red);color:#fff}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#091c31,#1769e0);padding:20px}.login .box{background:var(--card);width:min(420px,100%);padding:28px;border-radius:18px;box-shadow:0 20px 60px #0003}.brand{font-size:28px;font-weight:800;margin-bottom:22px}.sub{color:var(--muted);font-size:12px}.field{display:grid;gap:5px;margin:10px 0}.field label{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{background:var(--nav);color:#fff;padding:20px;display:flex;flex-direction:column;gap:18px}.side h1{font-size:22px;margin:0}.who{padding:12px;background:#ffffff12;border-radius:10px}.who small{display:block;color:#b8c9dc;margin-top:4px}.nav{display:grid;gap:5px}.nav button{background:transparent;color:#cbd8e8;text-align:left}.nav button.active,.nav button:hover{background:var(--blue);color:#fff}.side footer{margin-top:auto;display:flex;gap:7px}.side footer button{flex:1;background:#ffffff18;color:#fff}.main{padding:24px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:end;gap:15px;flex-wrap:wrap;margin-bottom:18px}.top h2{margin:0;font-size:28px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.ai{background:#fff9ec;border:1px solid #f0d99f;border-left:4px solid var(--gold);padding:10px;border-radius:11px;display:flex;gap:8px;margin-bottom:18px}.ai input{flex:1;border:1px solid #e4d3a6;border-radius:8px;padding:10px;min-width:180px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:18px}.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:16px;box-shadow:0 5px 18px #1634520b;margin-bottom:16px}.metric small{display:block;color:var(--muted);font-weight:800;text-transform:uppercase;font-size:10px}.metric strong{display:block;font-size:25px;margin-top:8px}.panel h3{margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.full{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}table{width:100%;border-collapse:collapse;min-width:700px}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:10px;color:var(--muted);text-transform:uppercase}.table{overflow:auto}.pill{border-radius:20px;padding:4px 8px;font-size:11px;font-weight:800;background:#eaf2ff;color:var(--blue)}.pill.green{background:#e6f7ef;color:var(--green)}.pill.red{background:#fdebed;color:var(--red)}.empty{padding:20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:9px}.toast{position:fixed;right:18px;bottom:18px;background:var(--green);color:#fff;padding:12px 16px;border-radius:9px;z-index:10}.toast.err{background:var(--red)}@media(max-width:850px){.app{grid-template-columns:1fr}.side{min-height:auto}.nav{grid-template-columns:repeat(2,1fr)}.main{padding:14px}.top h2{font-size:23px}.ai{flex-wrap:wrap}.ai input{flex-basis:100%}}
@media print{.side,.ai,.toolbar,button{display:none!important}.app{display:block}.main{padding:0}.panel,.card{box-shadow:none}}
</style></head><body>
<div id="login" class="login"><div class="box"><div class="brand">₺ kasam.net<div class="sub">Ön muhasebe · stok · personel · müşteri</div></div><div class="field"><label>Kullanıcı adı</label><input id="lu" value="admin"></div><div class="field"><label>Şifre</label><input id="lp" type="password" value="admin123"></div><button class="primary" style="width:100%" onclick="login()">Giriş yap</button><p class="sub">Demo: admin/admin123 · soli/soli123 · cagdaskent/cagdas123</p></div></div>
<div id="app" class="app hidden"><aside class="side"><h1>₺ kasam.net</h1><div class="who"><b id="wn"></b><small id="wr"></small></div><nav id="nav" class="nav"></nav><footer><button onclick="toggleTheme()">Tema</button><button onclick="logout()">Çıkış</button></footer></aside><main class="main"><div class="top"><div><h2 id="title"></h2><div id="scope" class="sub"></div></div><div class="toolbar"><div class="field"><label>İşlem tarihi</label><input type="date" id="date"></div><div id="branchBox"></div></div></div><div id="ai" class="ai"><input id="aiInput" placeholder="Kolay kayıt: İlhan'a 2000 TL ödeme yaptım"><button class="primary" onclick="aiAdd()">Hemen işle</button></div><div id="content"></div></main></div>
<script>
const KEY='kasamNetV1',SESSION='kasamSessionV1',BRANCHES=['Soli','Çağdaşkent'];let user=null,page='dashboard';let db={employees:[],employeeTx:[],customers:[],customerTx:[],materials:[],sales:[],cash:[],pos:[],couriers:[],recipes:[],audit:[]};const nav=[['dashboard','Genel Bakış'],['employees','Personel Hesapları'],['customers','Müşteri Hesapları'],['sales','Satışlar'],['materials','Mal Giriş/Çıkış'],['cash','Kasa'],['pos','Cep POS'],['couriers','Kurye'],['recipes','Reçete/Maliyet'],['reports','Raporlar']];const users=[{login:'admin',pass:'admin123',name:'Yönetici',role:'admin',branch:''},{login:'soli',pass:'soli123',name:'Soli',role:'branch',branch:'Soli'},{login:'cagdaskent',pass:'cagdas123',name:'Çağdaşkent',role:'branch',branch:'Çağdaşkent'}];const $=id=>document.getElementById(id),id=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random(),today=()=>new Date().toISOString().slice(0,10),money=n=>new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY'}).format(Number(n||0)),esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
function load(){try{db={...db,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{} }function save(){localStorage.setItem(KEY,JSON.stringify(db))}function toast(t,e=''){let x=document.createElement('div');x.className='toast '+e;x.textContent=t;document.body.append(x);setTimeout(()=>x.remove(),2600)}function activeBranch(){if(user.branch)return user.branch;return $('branch')?.value||''}function rows(a){return (db[a]||[]).filter(x=>!activeBranch()||x.branch===activeBranch())}function audit(action,oldData=null,newData=null){db.audit.unshift({id:id(),action,oldData,newData,user:user.name,date:today(),ts:Date.now()});save()}function add(c,r){r={id:id(),...r,createdBy:user.name,ts:Date.now()};db[c].unshift(r);audit(c+' kaydı eklendi',null,r);save();render();return r}function remove(c,i){if(!confirm('Kayıt iptal edilsin mi?'))return;let r=db[c].find(x=>x.id===i);if(r){r.cancelled=true;audit(c+' kaydı iptal edildi',r,{...r,cancelled:true});save();render()}}function edit(c,i){let r=db[c].find(x=>x.id===i);if(!r)return;let n=prompt('Yeni tutar veya not (JSON formatı):',JSON.stringify(r));if(!n)return;try{let v=JSON.parse(n);Object.assign(r,v,{id:i,updatedBy:user.name,updatedAt:Date.now()});audit(c+' kaydı düzenlendi',r,v);save();render()}catch{toast('JSON biçimi hatalı','err')}}
function login(){let u=$('lu').value,p=$('lp').value,m=users.find(x=>x.login===u&&x.pass===p);if(!m){toast('Kullanıcı veya şifre hatalı','err');return}user={...m};localStorage.setItem(SESSION,JSON.stringify(user));boot()}function logout(){localStorage.removeItem(SESSION);location.reload()}function boot(){load();$('login').classList.add('hidden');$('app').classList.remove('hidden');$('wn').textContent=user.name;$('wr').textContent=user.role==='admin'?'Yönetici':'Şube: '+user.branch;$('date').value=localStorage.getItem('kasamDate')||today();$('date').onchange=()=>localStorage.setItem('kasamDate',$('date').value);$('ai').style.display='flex';render()}function toggleTheme(){document.body.classList.toggle('dark');toast('Tema değiştirildi')}
function renderNav(){let n=$('nav');n.innerHTML='';nav.forEach(([k,v])=>{let b=document.createElement('button');b.textContent=v;b.className=k===page?'active':'';b.onclick=()=>{page=k;render()};n.append(b)})}function branchSelect(id='branch'){if(user.branch)return `<input type="hidden" id="${id}" value="${esc(user.branch)}"><div class="sub">Şube: ${esc(user.branch)}</div>`;return `<select id="${id}">${BRANCHES.map(x=>`<option>${x}</option>`)}</select>`}function render(){renderNav();$('title').textContent=(nav.find(x=>x[0]===page)||['',''])[1];$('branchBox').innerHTML=user.branch?'':`<select id="branch"><option value="">Tüm şubeler</option>${BRANCHES.map(x=>`<option>${x}</option>`)}</select>`;if($('branch'))$('branch').onchange=render;$('scope').textContent=activeBranch()||'Tüm şubeler';({dashboard,employees,customers,sales,materials,cash,pos,couriers,recipes,reports}[page]||dashboard)()}
function input(label,id,type='text',extra=''){return `<div class="field"><label>${label}</label><input id="${id}" type="${type}" ${extra}></div>`}function form(c,fields,button='Kaydet'){return `<form id="form" class="grid">${fields.join('')}<div class="full actions"><button class="primary">${button}</button></div></form>`}function table(headers,body){return `<div class="table"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${body||`<tr><td colspan="${headers.length}"><div class="empty">Kayıt yok</div></td></tr>`}</tbody></table></div>`}
function dashboard(){let s=rows('sales'),c=rows('cash'),m=rows('materials'),et=rows('employeeTx'),ct=rows('customerTx');let sale=s.reduce((a,x)=>a+Number(x.total||0),0),net=c.reduce((a,x)=>a+(x.type==='giriş'?1:-1)*Number(x.amount||0),0),staff=et.reduce((a,x)=>a+(x.type==='hakediş'?1:-1)*Number(x.amount||0),0),cust=ct.reduce((a,x)=>a+(x.type==='veresiye'?1:-1)*Number(x.amount||0),0);$('content').innerHTML=`<div class="cards"><div class="card metric"><small>Satış</small><strong>${money(sale)}</strong></div><div class="card metric"><small>Kasa net</small><strong>${money(net)}</strong></div><div class="card metric"><small>Personel alacağı</small><strong>${money(staff)}</strong></div><div class="card metric"><small>Müşteri alacağı</small><strong>${money(cust)}</strong></div><div class="card metric"><small>Mal hareketi</small><strong>${m.length}</strong></div></div><div class="panel"><h3>Hızlı başlangıç</h3><div class="sub">Kayıtları menülerden ekleyin. Düzenle butonu mevcut kaydı güvenli biçimde günceller; iptal geçmişi korur.</div></div>`}
function employees(){let es=rows('employees'),tx=rows('employeeTx');$('content').innerHTML=`<div class="panel"><h3>Personel ekle</h3>${form('employees',[input('Ad soyad','en'),input('Görev','er'),`<div class="field"><label>Şube</label>${branchSelect('eb')}</div>`,input('Telefon','ep')])}</div><div class="panel"><h3>Personel hesabı ve hızlı ödeme</h3>${form('employeeTx',[`<div class="field"><label>Personel</label><select id="ei">${es.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`)}</select></div>`,`<div class="field"><label>İşlem</label><select id="et"><option value="hakediş">Hakediş</option><option value="avans">Avans</option><option value="ödeme">Ödeme</option></select></div>`,input('Tutar','ea','number','step="0.01"'),input('Not','enote')])}</div><div class="panel"><h3>Personeller</h3>${table(['Ad','Görev','Şube','Hesap','İşlem'],es.map(e=>{let b=tx.filter(x=>x.employeeId===e.id).reduce((a,x)=>a+(x.type==='hakediş'?1:-1)*Number(x.amount||0),0);return `<tr><td>${esc(e.name)}</td><td>${esc(e.role)}</td><td>${esc(e.branch)}</td><td>${money(b)}</td><td><button class="secondary" onclick="quickEmp('${e.id}')">Ödeme</button></td></tr>`}).join(''))}</div>`;$('form').onsubmit=e=>{e.preventDefault();add('employees',{name:$('en').value,role:$('er').value,branch:$('eb').value,phone:$('ep').value});render()};document.querySelectorAll('#form')[1].onsubmit=e=>{e.preventDefault();let e1=$('ei').value;add('employeeTx',{employeeId:e1,employeeName:es.find(x=>x.id===e1)?.name,type:$('et').value,amount:+$('ea').value,note:$('enote').value,branch:es.find(x=>x.id===e1)?.branch,date:$('date').value});render()}}
function quickEmp(i){page='employees';render();setTimeout(()=>{$('ei').value=i;$('et').value='ödeme';$('ea').focus()},0)}
function customers(){let cs=rows('customers'),tx=rows('customerTx');$('content').innerHTML=`<div class="panel"><h3>Müşteri ekle</h3>${form('customers',[input('Ad soyad','cn'),input('Telefon','cp'),`<div class="field"><label>Şube</label>${branchSelect('cb')}</div>`,input('Not','cno')])}</div><div class="panel"><h3>Müşteri hesabı ve hızlı tahsilat</h3>${form('customerTx',[`<div class="field"><label>Müşteri</label><select id="ci">${cs.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`)}</select></div>`,`<div class="field"><label>İşlem</label><select id="ct"><option value="veresiye">Veresiye</option><option value="tahsilat">Tahsilat</option></select></div>`,input('Tutar','ca','number','step="0.01"'),input('Not','cnot')])}</div><div class="panel"><h3>Müşteriler</h3>${table(['Ad','Şube','Bakiye','İşlem'],cs.map(c=>{let b=tx.filter(x=>x.customerId===c.id).reduce((a,x)=>a+(x.type==='veresiye'?1:-1)*Number(x.amount||0),0);return `<tr><td>${esc(c.name)}</td><td>${esc(c.branch)}</td><td>${money(b)}</td><td><button class="secondary" onclick="quickCust('${c.id}')">Tahsilat</button></td></tr>`}).join(''))}</div>`;document.querySelector('#content form').onsubmit=e=>{e.preventDefault();add('customers',{name:$('cn').value,phone:$('cp').value,branch:$('cb').value,note:$('cno').value});render()};document.querySelectorAll('#content form')[1].onsubmit=e=>{e.preventDefault();let c=cs.find(x=>x.id===$('ci').value);add('customerTx',{customerId:c.id,customerName:c.name,type:$('ct').value,amount:+$('ca').value,note:$('cnot').value,branch:c.branch,date:$('date').value});render()}}
function quickCust(i){page='customers';render();setTimeout(()=>{$('ci').value=i;$('ct').value='tahsilat';$('ca').focus()},0)}
function simplePage(kind,title,fields,handler,cols,items){$('content').innerHTML=`<div class="panel"><h3>${title}</h3>${form(kind,fields)}</div><div class="panel">${table(cols,items)}</div>`;$('form').onsubmit=e=>{e.preventDefault();handler();render()}}
function sales(){let rs=rows('sales');simplePage('sales','Satış ekle',[input('Ürün','sn'),input('Miktar','sq','number'),input('Birim fiyat','su','number','step="0.01"'),`<div class="field"><label>Ödeme</label><select id="sp"><option>Nakit</option><option>Cep POS</option><option>Kart</option><option>Veresiye</option></select></div>`],()=>add('sales',{product:$('sn').value,qty:+$('sq').value,unit:+$('su').value,total:+$('sq').value*+$('su').value,payment:$('sp').value,branch:activeBranch()||BRANCHES[0],date:$('date').value}),['Tarih','Ürün','Miktar','Toplam','Ödeme'],rs.map(r=>`<tr><td>${r.date}</td><td>${esc(r.product)}</td><td>${r.qty}</td><td>${money(r.total)}</td><td>${esc(r.payment)}</td></tr>`).join(''))}
function materials(){let rs=rows('materials');simplePage('materials','Mal girişi / çıkışı',[`<div class="field"><label>Tür</label><select id="mt"><option value="giriş">Giriş</option><option value="çıkış">Çıkış</option></select></div>`,input('Malzeme','mn'),input('Miktar','mq','number'),input('Birim fiyat','mu','number','step="0.01"'),input('Tedarikçi/not','mno')],()=>add('materials',{type:$('mt').value,item:$('mn').value,qty:+$('mq').value,unit:+$('mu').value,total:+$('mq').value*+$('mu').value,note:$('mno').value,branch:activeBranch()||BRANCHES[0],date:$('date').value}),['Tarih','Tür','Malzeme','Miktar','Toplam'],rs.map(r=>`<tr><td>${r.date}</td><td>${r.type}</td><td>${esc(r.item)}</td><td>${r.qty}</td><td>${money(r.total)}</td></tr>`).join(''))}
function cash(){let rs=rows('cash');simplePage('cash','Kasa',[`<div class="field"><label>Tür</label><select id="cst"><option value="giriş">Giriş</option><option value="çıkış">Çıkış</option></select></div>`,input('Tutar','csa','number','step="0.01"'),input('Açıklama','csn')],()=>add('cash',{type:$('cst').value,amount:+$('csa').value,note:$('csn').value,branch:activeBranch()||BRANCHES[0],date:$('date').value}),['Tarih','Tür','Tutar','Açıklama'],rs.map(r=>`<tr><td>${r.date}</td><td>${r.type}</td><td>${money(r.amount)}</td><td>${esc(r.note)}</td></tr>`).join(''))}
function pos(){let rs=rows('pos');simplePage('pos','Cep POS',[input('İşlem/kişi','pn'),input('Tutar','pa','number','step="0.01"'),input('Komisyon %','pc','number','step="0.01"'),input('Not','pno')],()=>{let a=+$('pa').value,k=+$('pc').value||0;add('pos',{name:$('pn').value,amount:a,commission:a*k/100,net:a-a*k/100,note:$('pno').value,branch:activeBranch()||BRANCHES[0],date:$('date').value})},['Tarih','Ad','Brüt','Komisyon','Net'],rs.map(r=>`<tr><td>${r.date}</td><td>${esc(r.name)}</td><td>${money(r.amount)}</td><td>${money(r.commission)}</td><td>${money(r.net)}</td></tr>`).join(''))}
function couriers(){let rs=rows('couriers');simplePage('couriers','Kurye',[input('Kurye','kn'),input('Başlangıç','ks','time'),input('Bitiş','ke','time'),input('Ücret/POS','ka','number','step="0.01"'),input('Not','kno')],()=>add('couriers',{name:$('kn').value,start:$('ks').value,end:$('ke').value,amount:+$('ka').value,note:$('kno').value,branch:activeBranch()||BRANCHES[0],date:$('date').value}),['Tarih','Kurye','Başlangıç','Bitiş','Tutar'],rs.map(r=>`<tr><td>${r.date}</td><td>${esc(r.name)}</td><td>${r.start}</td><td>${r.end}</td><td>${money(r.amount)}</td></tr>`).join(''))}
function recipes(){let rs=db.recipes;simplePage('recipes','Ürün reçetesi / maliyet',[input('Ürün','rn'),input('Birim maliyet','rc','number','step="0.01"'),input('Satış fiyatı','rp','number','step="0.01"'),input('Malzeme formülü/not','rno')],()=>add('recipes',{product:$('rn').value,cost:+$('rc').value,price:+$('rp').value,note:$('rno').value,branch:activeBranch()||BRANCHES[0]}),['Ürün','Maliyet','Fiyat','Kâr','Oran'],rs.map(r=>`<tr><td>${esc(r.product)}</td><td>${money(r.cost)}</td><td>${money(r.price)}</td><td>${money(r.price-r.cost)}</td><td>${r.price?((r.price-r.cost)/r.price*100).toFixed(1):0}%</td></tr>`).join(''))}
function reports(){$('content').innerHTML=`<div class="panel"><h3>Raporlar</h3><p class="sub">Seçili şube ve tarihe göre yazdırılabilir günlük rapor.</p><div class="actions"><button class="primary" onclick="window.print()">PDF / Yazdır</button><button class="secondary" onclick="backup()">JSON yedek indir</button></div></div><div class="panel"><h3>Denetim günlüğü</h3>${table(['Tarih','Kullanıcı','İşlem'],db.audit.slice(0,100).map(x=>`<tr><td>${x.date}</td><td>${esc(x.user)}</td><td>${esc(x.action)}</td></tr>`).join(''))}</div>`}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='kasam-yedek-'+today()+'.json';a.click()}
function aiAdd(){let t=$('aiInput').value.trim(),n=t.match(/([\d.,]+)\s*(?:tl|₺)/i),amount=n?parseFloat(n[1].replace(/\./g,'').replace(',','.')):0,lower=t.toLocaleLowerCase('tr');if(!amount){toast('Tutarı yazın: örn. İlhan’a 2000 TL ödeme yaptım.','err');return}let e=db.employees.find(x=>lower.includes(x.name.toLocaleLowerCase('tr'))),c=db.customers.find(x=>lower.includes(x.name.toLocaleLowerCase('tr')));if(e&&(lower.includes('ödeme')||lower.includes('ödedim')||lower.includes('avans'))){add('employeeTx',{employeeId:e.id,employeeName:e.name,type:lower.includes('avans')?'avans':'ödeme',amount,branch:e.branch,date:$('date').value,note:'Kolay AI kaydı'});toast(e.name+' hesabına işlendi');$('aiInput').value='';return}if(c&&(lower.includes('tahsil')||lower.includes('aldım'))){add('customerTx',{customerId:c.id,customerName:c.name,type:'tahsilat',amount,branch:c.branch,date:$('date').value,note:'Kolay AI kaydı'});toast(c.name+' tahsilatı işlendi');$('aiInput').value='';return}if(lower.includes('kasa')){add('cash',{type:lower.includes('çık')?'çıkış':'giriş',amount,note:t,branch:activeBranch()||BRANCHES[0],date:$('date').value});toast('Kasa işlemi işlendi');$('aiInput').value='';return}toast('Kişi bulunamadı veya cümle anlaşılamadı. Önce personel/müşteri ekleyin.','err')}
function init(){load();let s=localStorage.getItem(SESSION);if(s){user=JSON.parse(s);boot()}$('date').value=today();$('lu').onkeydown=e=>e.key==='Enter'&&login();$('lp').onkeydown=e=>e.key==='Enter'&&login();$('aiInput').onkeydown=e=>e.key==='Enter'&&aiAdd()}init();
</script></body></html>
