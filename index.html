<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>kasam.net</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#102a43;--muted:#64748b;--line:#dbe4ee;--nav:#0f172a;--blue:#1769e0;--green:#138a5b;--red:#c93c4b;--amber:#a96b10;--purple:#6941c6;--shadow:0 10px 28px rgba(15,39,64,.08)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,Segoe UI,sans-serif}
button,input,select,textarea{font:inherit}button{border:0;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer}
input,select,textarea{width:100%;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:11px}
textarea{min-height:100px;resize:vertical}label{display:block;font-size:12px;font-weight:850;color:var(--muted);text-transform:uppercase}
label input,label select,label textarea{margin-top:5px;text-transform:none;font-weight:500}.hidden{display:none!important}
.primary{background:var(--blue);color:#fff}.ghost{background:#eef4ff;color:var(--ink);border:1px solid var(--line)}.danger{background:#fff0f2;color:var(--red)}.success{background:#e8f8ef;color:var(--green)}.warn{background:#fff7df;color:var(--amber)}.full{width:100%}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#0f172a,#1d4ed8)}
.login-card{width:min(450px,100%);background:#fff;border-radius:24px;padding:28px;box-shadow:var(--shadow)}.login-card label{margin:13px 0}
.brand{font-size:34px;font-weight:950;letter-spacing:-2px}.brand span{font-size:.42em;letter-spacing:0;color:#5b7bb8}.brand.small{font-size:22px;color:#fff}.muted,.hint{color:var(--muted)}.hint{font-size:12px}
.shell{min-height:100vh;display:grid;grid-template-columns:270px 1fr}.sidebar{background:var(--nav);padding:22px 16px;color:#fff;display:flex;flex-direction:column;gap:18px}
.userbox{background:#ffffff12;border-radius:14px;padding:12px}.userbox small{display:block;color:#cbd5e1;margin-top:3px}
#nav{display:grid;gap:5px}#nav button{background:transparent;color:#dbe7fb;text-align:left}#nav button.active{background:var(--blue);color:#fff}
.side-actions{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:7px}
.main{width:100%;max-width:1650px;margin:auto;padding:24px}.topbar{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.topbar h1{font-size:clamp(26px,4vw,40px);margin:4px 0 0}.eyebrow{color:var(--muted);font-weight:900}.toptools{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}.toptools label{min-width:160px}
.ai-entry{background:linear-gradient(135deg,#fff,#f6f8ff);border:1px solid #cad9ec;border-left:5px solid var(--purple);border-radius:17px;padding:16px;margin-bottom:18px;box-shadow:var(--shadow)}
.ai-head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.ai-head strong{font-size:18px}.ai-row{display:grid;grid-template-columns:1fr auto;gap:10px}.ai-row textarea{min-height:115px}.ai-actions{display:grid;gap:8px;min-width:155px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px;margin-bottom:18px}.metric,.panel{background:var(--card);border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow)}
.metric{padding:17px}.metric small{display:block;color:var(--muted);font-size:11px;font-weight:900;text-transform:uppercase}.metric strong{display:block;margin-top:8px;font-size:24px}.metric .sub{margin-top:5px;font-size:12px;color:var(--muted)}.metric.good strong{color:var(--green)}.metric.bad strong{color:var(--red)}
.panel{padding:17px;margin-bottom:18px}.panel-head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:13px}.panel h2,.panel h3{margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.actions{display:flex;gap:7px;flex-wrap:wrap}.mini{padding:7px 9px;font-size:12px}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:800px}th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:11px;text-transform:uppercase;color:var(--muted)}.empty{text-align:center;color:var(--muted);padding:25px}
.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:900}.ok{background:#e8f8ef;color:var(--green)}.bad-badge{background:#fff0f2;color:var(--red)}.info{background:#eef4ff;color:#2558a8}.warning{background:#fff7df;color:var(--amber)}
.split{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}.big-result{padding:18px;border-radius:16px;background:linear-gradient(135deg,#f7fbff,#eef5ff);border:1px solid #cfe0f4}.big-result .value{font-size:36px;font-weight:950}.big-result.good .value{color:var(--green)}.big-result.bad .value{color:var(--red)}
.insights{display:grid;gap:9px}.insight{padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:#fbfdff}.insight strong{display:block;margin-bottom:4px}
.cost-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.cost-card{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}.cost-card .big{font-size:23px;font-weight:950;margin-top:5px}
.smart-preview{margin-top:12px;display:grid;gap:8px}.smart-item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.callout{border-left:5px solid var(--blue);background:#f7fbff;padding:13px;border-radius:12px;margin-bottom:12px}.callout.warnc{border-left-color:var(--amber);background:#fffaf0}
.profit-waterfall{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.flow{padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff}.flow small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;font-weight:900}.flow strong{font-size:20px;display:block;margin-top:6px}.flow.minus strong{color:var(--red)}.flow.plus strong{color:var(--green)}
.modal{position:fixed;inset:0;background:#0f172a99;display:grid;place-items:center;padding:18px;z-index:50}.modal-card{width:min(1000px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:20px;padding:20px}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}
.toast{position:fixed;right:18px;bottom:18px;z-index:80;padding:13px 16px;border-radius:11px;background:var(--green);color:#fff;box-shadow:var(--shadow)}.toast.err{background:var(--red)}
@media(max-width:900px){.split{grid-template-columns:1fr}.shell{display:block}.sidebar{padding:14px}.brand.small,.userbox{display:inline-block;margin-right:8px}#nav{grid-template-columns:repeat(2,1fr)}.side-actions{grid-template-columns:repeat(2,1fr)}.main{padding:15px}.toptools{width:100%}.toptools>*{flex:1}.ai-row{grid-template-columns:1fr}.ai-actions{grid-template-columns:1fr 1fr}table{min-width:720px}}

.report-drop{border:2px dashed #9fb7d6;border-radius:16px;background:#f8fbff;padding:22px;text-align:center;transition:.2s;cursor:pointer}
.report-drop.drag{border-color:var(--blue);background:#eef5ff;transform:scale(1.003)}
.report-drop strong{display:block;font-size:18px;margin-bottom:5px}
.report-progress{margin-top:12px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;text-align:left}
.progress-track{height:9px;border-radius:999px;background:#e9eff7;overflow:hidden;margin-top:8px}
.progress-fill{height:100%;background:var(--blue);width:0%;transition:width .2s}
.pending-report{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}
.pending-report+.pending-report{margin-top:10px}
.pending-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:10px}
.pending-cell{padding:9px;border-radius:10px;background:#f7f9fc}
.pending-cell small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;font-weight:900}
.pending-cell strong{display:block;margin-top:3px}
.method-chip{font-size:11px;font-weight:900;padding:4px 8px;border-radius:999px;background:#eef4ff;color:#2558a8}
.method-chip.ocr{background:#f1edff;color:var(--purple)}
.pdf-help{font-size:12px;color:var(--muted);line-height:1.5}

</style>
</head>
<body>

<div id="login" class="login">
  <div class="login-card">
    <div class="brand">₺ kasam.net</div>
    <p class="muted">Restoran rapor, maliyet, gider, veresiye, kurye ve günlük kâr/zarar sistemi.</p>
    <label>Kullanıcı adı<input id="loginUser" value="admin"></label>
    <label>Şifre<input id="loginPass" type="password" value="admin123"></label>
    <button id="loginBtn" class="primary full">Giriş Yap</button>
    <p class="hint">Demo: admin/admin123 · soli/soli123 · cagdaskent/cagdas123</p>
  </div>
</div>

<div id="app" class="shell hidden">
  <aside class="sidebar">
    <div class="brand small">₺ kasam.net</div>
    <div class="userbox"><strong id="who"></strong><small id="role"></small></div>
    <nav id="nav"></nav>
    <div class="side-actions">
      <button id="backupBtn" class="ghost">Yedek</button>
      <button id="logoutBtn" class="danger">Çıkış</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div><small class="eyebrow">KASAM.NET</small><h1 id="title">Günlük Sonuç</h1></div>
      <div class="toptools">
        <label>Gün<input type="date" id="workDate"></label>
        <div id="branchWrap"></div>
      </div>
    </header>

    <section class="ai-entry">
      <div class="ai-head">
        <div>
          <strong>✨ Akıllı Giriş</strong>
          <div class="hint">Normal konuşur gibi yaz. Yüksek güvenli kayıtları otomatik ayırır.</div>
        </div>
        <label style="display:flex;align-items:center;gap:7px;text-transform:none">
          <input id="autoApply" type="checkbox" checked style="width:auto;margin:0"> Otomatik kaydet
        </label>
      </div>
      <div class="ai-row">
        <textarea id="smartText" placeholder="Örnek:
100 ambalaj 1000 TL aldım
10 kg tavuk 2200 TL aldım
banka bugün 420 TL kesti
bugün 99 tavuk 55 et 30 biftek sattım
Ahmet kurye 9 saat çalıştı saatlik 150 TL POS 4200 TL 12 teslimat
Kadir 1300 TL veresiye yaz
Kadir 500 TL ödedi"></textarea>
        <div class="ai-actions">
          <button id="smartBtn" class="primary">Anla ve İşle</button>
          <button id="aiJsonBtn" class="ghost">AI Analiz JSON</button>
          <input id="aiJsonInput" type="file" accept=".json,application/json" class="hidden">
        </div>
      </div>
      <div id="smartResult" class="hidden"></div>
    </section>

    <section id="content"></section>
  </main>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head"><h2 id="modalTitle"></h2><button id="closeModal" class="ghost">Kapat</button></div>
    <div id="modalBody"></div>
  </div>
</div>
<div id="toast" class="toast hidden"></div>

<script>
'use strict';

const KEY='kasamNetSingleAI', SESSION='kasamNetSingleSession';
const BRANCHES=['Soli','Çağdaşkent'];
const USERS=[
  {username:'admin',password:'admin123',name:'Yönetici',role:'admin',branch:null},
  {username:'soli',password:'soli123',name:'Soli Şube',role:'branch',branch:'Soli'},
  {username:'cagdaskent',password:'cagdas123',name:'Çağdaşkent Şube',role:'branch',branch:'Çağdaşkent'}
];
const MENUS={
  dashboard:'Günlük Sonuç',
  reports:'Günlük Raporlar',
  costs:'Maliyet Merkezi',
  quantities:'Ürün Adetleri',
  customers:'Müşteri Veresiye',
  employees:'Personel Hesapları',
  suppliers:'Tedarikçi Borçları',
  stock:'Stok Takibi',
  cash:'Kasa Mutabakatı',
  closing:'Günlük Kapanış',
  classify:'Gider Sınıfları',
  expenses:'Gider / Kesinti',
  couriers:'Kurye / POS',
  history:'Geçmiş',
  analytics:'Analiz',
  backup:'Yedek / Ayarlar'
};
const EMPTY={
  version:1,
  settings:{targetMargin:20,autoStockOnClose:true,lowStockWarn:true},
  reportImports:[],
  componentCosts:[],
  recipes:[],
  directCosts:[],
  productAliases:[],
  quantities:[],
  customers:[],
  customerTx:[],
  employees:[],
  employeeTx:[],
  suppliers:[],
  supplierTx:[],
  stockMoves:[],
  cashMoves:[],
  cashChecks:[],
  closings:[],
  extraExpenses:[],
  platformCosts:[],
  bankFees:[],
  recurring:[],
  couriers:[],
  expenseRules:[],
  audit:[]
};

let state={user:null,page:'dashboard',date:new Date().toISOString().slice(0,10),branch:'Soli',pendingReports:[],pdfBusy:false,pdfProgress:''};
const $=id=>document.getElementById(id);
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2);
const money=v=>new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY'}).format(Number(v)||0);
const pct=v=>(Number(v)||0).toFixed(1).replace('.',',')+'%';
const now=()=>new Date().toISOString();
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=v=>{
  const s=String(v??'').trim().replace(/\s/g,'');
  if(!s)return 0;
  if(s.includes(','))return Number(s.replace(/\./g,'').replace(',','.'))||0;
  return Number(s)||0;
};
const norm=s=>String(s??'').toLocaleLowerCase('tr-TR').replace(/[^\p{L}\p{N}]+/gu,' ').trim();

function blank(){return JSON.parse(JSON.stringify(EMPTY))}
function load(){
  try{
    const x=JSON.parse(localStorage.getItem(KEY)||'null');
    if(!x)return blank();
    const base=blank();
    return {...base,...x,settings:{...base.settings,...(x.settings||{})}};
  }catch{return blank()}
}
function mirrorDb(db){
  return new Promise((resolve,reject)=>{
    if(!('indexedDB'in window))return resolve(false);
    const req=indexedDB.open('kasamNetRecovery',1);
    req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains('snapshots'))d.createObjectStore('snapshots',{keyPath:'id'})};
    req.onerror=()=>reject(req.error);
    req.onsuccess=()=>{const d=req.result,tx=d.transaction('snapshots','readwrite');tx.objectStore('snapshots').put({id:'latest',at:now(),data:db});tx.oncomplete=()=>{d.close();resolve(true)};tx.onerror=()=>{d.close();reject(tx.error)}};
  });
}
function readMirror(){
  return new Promise((resolve,reject)=>{
    if(!('indexedDB'in window))return resolve(null);
    const req=indexedDB.open('kasamNetRecovery',1);
    req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains('snapshots'))d.createObjectStore('snapshots',{keyPath:'id'})};
    req.onerror=()=>reject(req.error);
    req.onsuccess=()=>{const d=req.result,tx=d.transaction('snapshots','readonly'),g=tx.objectStore('snapshots').get('latest');g.onsuccess=()=>{d.close();resolve(g.result||null)};g.onerror=()=>{d.close();reject(g.error)}};
  });
}
function save(db){
  const serialized=JSON.stringify(db);
  try{localStorage.setItem(KEY,serialized)}
  catch(e){console.error(e);try{toast('Tarayıcı depolaması dolu. Yedek indirip eski verileri temizle.',true)}catch{};throw e}
  mirrorDb(db).catch(()=>{});
}
function branch(){return state.user?.role==='branch'?state.user.branch:state.branch}
function active(arr){return (arr||[]).filter(x=>x.status!=='iptal')}
function toast(msg,err=false){const el=$('toast');el.textContent=msg;el.classList.toggle('err',err);el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),2500)}
function audit(action){const db=load();db.audit.unshift({id:uid(),at:now(),user:state.user?.name||'Sistem',branch:branch(),action});save(db)}
function modal(title,html){$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('modal').classList.remove('hidden')}
function closeModal(){$('modal').classList.add('hidden');$('modalBody').innerHTML=''}
function table(headers,body){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${body||`<tr><td colspan="${headers.length}" class="empty">Kayıt yok.</td></tr>`}</tbody></table></div>`}
function download(name,text,type='application/json'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function getClosing(db,date=state.date,b=branch()){
  return active(db.closings).filter(x=>x.date===date&&x.branch===b).sort((a,b)=>(b.closedAt||'').localeCompare(a.closedAt||''))[0]||null;
}
function isDayClosed(date=state.date,b=branch()){
  return !!getClosing(load(),date,b);
}
function requireOpenDay(date=state.date,b=branch()){
  if(isDayClosed(date,b)){
    toast(`${date} günü kapalı. Önce Günlük Kapanış ekranından yeniden aç.`,true);
    return false;
  }
  return true;
}

function softDelete(key,id){
  if(key==='closings')return;
  const db=load(),x=db[key]?.find(r=>r.id===id);if(!x)return;
  const recordDate=x.date||x.effectiveFrom||state.date,recordBranch=x.branch||branch();
  if(!requireOpenDay(recordDate,recordBranch))return;
  if(!confirm('Kayıt iptal edilsin mi?'))return;
  x.status='iptal';x.cancelledAt=now();save(db);audit(`${key} kaydı iptal edildi`);render();toast('Kayıt iptal edildi');
}

function convert(qty,from,to){
  qty=n(qty);from=norm(from);to=norm(to);
  if(!from||!to||from===to)return qty;
  if(from==='gr'&&to==='kg')return qty/1000;
  if(from==='kg'&&to==='gr')return qty*1000;
  if(from==='ml'&&to==='lt')return qty/1000;
  if(from==='lt'&&to==='ml')return qty*1000;
  return null;
}
function recordOrder(x){return String(x.createdAt||x.at||x.id||'')}
function latestByDateAndTime(rows){
  return rows.slice().sort((a,b)=>{
    const d=String(b.effectiveFrom||'').localeCompare(String(a.effectiveFrom||''));
    return d||recordOrder(b).localeCompare(recordOrder(a));
  })[0]||null;
}
function latestComponent(db,name,date){
  return latestByDateAndTime(active(db.componentCosts).filter(x=>x.branch===branch()&&norm(x.component)===norm(name)&&x.effectiveFrom<=date));
}
function knownProducts(db){
  return [...new Set([...active(db.recipes).filter(x=>x.branch===branch()).map(x=>x.product),...active(db.directCosts).filter(x=>x.branch===branch()).map(x=>x.product)])];
}
function canonicalProduct(db,raw){
  const r=String(raw||'').trim(),k=norm(r);if(!k)return r;
  const explicit=active(db.productAliases).filter(x=>x.branch===branch()&&norm(x.alias)===k).sort((a,b)=>recordOrder(b).localeCompare(recordOrder(a)))[0];
  if(explicit)return explicit.product;
  const products=knownProducts(db),exact=products.find(x=>norm(x)===k);if(exact)return exact;
  const fuzzy=products.filter(x=>{const q=norm(x);return q.includes(k)||k.includes(q)});
  return fuzzy.length===1?fuzzy[0]:r;
}
function productCost(db,product,date){
  const canonical=canonicalProduct(db,product);
  const allRows=active(db.recipes).filter(x=>x.branch===branch()&&norm(x.product)===norm(canonical)&&x.effectiveFrom<=date);
  if(allRows.length){
    const byComponent=new Map();
    for(const r of allRows){
      const key=norm(r.component);
      const prev=byComponent.get(key);
      if(!prev || r.effectiveFrom>prev.effectiveFrom || (r.effectiveFrom===prev.effectiveFrom && recordOrder(r)>recordOrder(prev))) byComponent.set(key,r);
    }
    const rows=[...byComponent.values()].filter(r=>n(r.qty)>0);
    let total=0,missing=[];
    for(const r of rows){
      const c=latestComponent(db,r.component,date);
      if(!c){missing.push(r.component);continue}
      const converted=convert(r.qty,r.unit,c.unit);
      if(converted===null){missing.push(`${r.component} (${r.unit}→${c.unit})`);continue}
      total+=converted*n(c.unitCost)*(1+n(r.wastagePct||0)/100);
    }
    if(rows.length)return {source:'recipe',unitCost:total,missing,canonical};
  }
  const d=latestByDateAndTime(active(db.directCosts).filter(x=>x.branch===branch()&&norm(x.product)===norm(canonical)&&x.effectiveFrom<=date));
  return d?{source:'direct',unitCost:n(d.unitCost),missing:[],canonical}:{source:'none',unitCost:0,missing:[canonical||product],canonical};
}
function resolveReports(db,date){
  const all=active(db.reportImports).filter(x=>x.date===date&&x.branch===branch());
  const latest=t=>all.filter(x=>x.reportType===t).sort((a,b)=>(b.importedAt||'').localeCompare(a.importedAt||''))[0];
  const general=latest('general'),z=latest('z'),expense=latest('expense');
  const sales=(general&&n(general.salesNet)>0)?general:((z&&n(z.salesNet)>0)?z:(general||z||null));
  const pickCats=(...lists)=>lists.find(a=>Array.isArray(a)&&a.length)||[];
  const expenseCandidates=[expense,z,general].filter(Boolean);
  const expenseSource=expenseCandidates.find(x=>n(x.expenseTotal)>0)||expenseCandidates[0]||null;
  return {
    all,general,z,expense,sales,expenseSource,
    salesNet:sales?n(sales.salesNet):0,
    cancel:sales?n(sales.cancel):0,
    discount:sales?n(sales.discount):0,
    expenseTotal:expenseSource?n(expenseSource.expenseTotal):0,
    expenseCategories:pickCats(expense?.expenseCategories,z?.expenseCategories,general?.expenseCategories),
    paymentDistribution:(general?.paymentDistribution&&Object.values(general.paymentDistribution).some(v=>n(v)>0))?general.paymentDistribution:((z?.paymentDistribution&&Object.values(z.paymentDistribution).some(v=>n(v)>0))?z.paymentDistribution:{})
  };
}
function classifyExpenses(db,cats){
  let operating=0,inventory=0,excluded=0,unclassified=0;
  const rows=(cats||[]).map(c=>{
    const rules=active(db.expenseRules).filter(r=>norm(r.category)===norm(c.category)); const rule=rules.find(r=>r.branch===branch())||rules.find(r=>!r.branch);
    const type=rule?.type||c.type||'unclassified',amount=n(c.amount);
    if(type==='operating')operating+=amount;
    else if(type==='inventory')inventory+=amount;
    else if(type==='excluded')excluded+=amount;
    else unclassified+=amount;
    return {...c,type,amount};
  });
  return {rows,operating,inventory,excluded,unclassified};
}
function recurringDaily(x,date){
  const amount=n(x.amount);
  if(x.frequency==='daily')return amount;
  if(x.frequency==='weekly')return amount/7;
  if(x.frequency==='monthly'){const d=new Date(date+'T12:00:00');return amount/new Date(d.getFullYear(),d.getMonth()+1,0).getDate()}
  return 0;
}
function calcDay(date=state.date){
  const db=load(),r=resolveReports(db,date),cls=classifyExpenses(db,r.expenseCategories);
  const categorizedTotal=(r.expenseCategories||[]).reduce((a,x)=>a+n(x.amount),0);
  const expenseRemainder=Math.max(0,n(r.expenseTotal)-categorizedTotal);
  const unclassifiedExpense=cls.unclassified+expenseRemainder; const expenseCategoryOverage=Math.max(0,categorizedTotal-n(r.expenseTotal));
  const qty=active(db.quantities).filter(x=>x.date===date&&x.branch===branch());
  let cogs=0,missing=[],costDetails=[];
  for(const x of qty){
    const pc=productCost(db,x.product,date),total=n(x.qty)*n(pc.unitCost);
    cogs+=total;if(pc.missing.length)missing.push(...pc.missing);
    costDetails.push({product:x.product,canonical:pc.canonical||x.product,qty:n(x.qty),unitCost:pc.unitCost,total});
  }
  const extra=active(db.extraExpenses).filter(x=>x.date===date&&x.branch===branch()).reduce((a,x)=>a+n(x.amount),0);
  const platform=active(db.platformCosts).filter(x=>x.date===date&&x.branch===branch()).reduce((a,x)=>a+n(x.amount),0);
  const bank=active(db.bankFees).filter(x=>x.date===date&&x.branch===branch()).reduce((a,x)=>a+n(x.amount),0);
  const recurring=active(db.recurring).filter(x=>x.branch===branch()&&x.startDate<=date&&(!x.endDate||x.endDate>=date)).reduce((a,x)=>a+recurringDaily(x,date),0);
  const couriers=active(db.couriers).filter(x=>x.date===date&&x.branch===branch());
  const courierAdd=couriers.filter(x=>x.addToProfit).reduce((a,x)=>a+n(x.hours)*n(x.hourlyRate)+n(x.fixedPay),0);
  const employeeAdd=active(db.employeeTx).filter(x=>x.date===date&&x.branch===branch()&&(x.type==='hakediş'||x.type==='emanet')&&x.addToProfit).reduce((a,x)=>a+n(x.amount),0);
  const courierPos=couriers.reduce((a,x)=>a+n(x.pos),0),courierHours=couriers.reduce((a,x)=>a+n(x.hours),0),courierOrders=couriers.reduce((a,x)=>a+n(x.orders),0);
  const cashResult=r.salesNet-r.expenseTotal-extra-platform-bank-courierAdd;
  const trueProfit=r.salesNet-cogs-cls.operating-unclassifiedExpense-extra-platform-bank-recurring-courierAdd-employeeAdd;
  const trueMargin=r.salesNet?trueProfit/r.salesNet*100:0;
  const issues=[];if(!r.sales)issues.push('Satış raporu eksik');if(!qty.length)issues.push('Ürün adetleri eksik');if(missing.length)issues.push('Maliyet/reçete eksik');if(unclassifiedExpense>0)issues.push('Gider sınıflandırması eksik');if(expenseCategoryOverage>.5)issues.push('Gider kalemleri toplamı rapor giderini aşıyor');
  if(r.general&&r.z&&Math.abs(n(r.general.salesNet)-n(r.z.salesNet))>.5)issues.push('Genel ve Z raporu uyuşmuyor');
  return {r,cls,expenseRemainder,expenseCategoryOverage,unclassifiedExpense,qty,cogs,costDetails,missing:[...new Set(missing)],extra,platform,bank,recurring,couriers,courierAdd,employeeAdd,courierPos,courierHours,courierOrders,cashResult,trueProfit,trueMargin,quality:Math.max(0,100-issues.length*18),issues};
}

function parseTRAmount(raw){
  let s=String(raw||'').replace(/[^\d.,-]/g,'').trim();
  if(!s)return 0;
  if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');
  else{
    const parts=s.split('.');
    if(parts.length>2)s=parts.join('');
    else if(parts.length===2&&parts[1].length===3)s=parts.join('');
  }
  return Number(s)||0;
}
function moneyTokens(text){
  const matches=String(text||'').match(/\b\d{1,3}(?:[.\s]\d{3})*(?:,\d{2})\b|\b\d+(?:,\d{2})\b/g)||[];
  return [...new Set(matches.map(parseTRAmount).filter(x=>x>0))];
}
function lineAmount(line){
  const vals=moneyTokens(line);
  return vals.length?vals[vals.length-1]:0;
}
function findAmountByLabels(text,labels){
  const lines=String(text||'').split(/\n+/).map(x=>x.trim()).filter(Boolean);
  for(const label of labels){
    const lk=norm(label);
    for(const line of lines){
      if(norm(line).includes(lk)){
        const a=lineAmount(line);
        if(a>0)return a;
      }
    }
  }
  return 0;
}
function findCountByLabels(text,labels){
  const lines=String(text||'').split(/\n+/).map(x=>x.trim()).filter(Boolean);
  for(const label of labels){
    const lk=norm(label);
    for(const line of lines){
      if(norm(line).includes(lk)){
        const nums=line.match(/\b\d{1,4}\b/g)||[];
        if(nums.length)return Number(nums[nums.length-1])||0;
      }
    }
  }
  return 0;
}
function detectReportType(fileName,text=''){
  const f=norm(fileName),t=norm(String(text).slice(0,2200));
  if(f.includes('genel gider')||f.includes('gider raporu')||t.includes('genel gider raporu'))return 'expense';
  if(/(^| )z( |$)/.test(f)||f.includes('z raporu')||t.includes('z raporu'))return 'z';
  if(f.includes('genel rapor')||t.includes('genel rapor'))return 'general';
  if(f.includes('yemeksepeti')||f.includes('trendyol')||f.includes('migros'))return 'platform';
  return 'general';
}
function dateFromReport(fileName,text=''){
  const sources=[String(fileName||''),String(text||'').slice(0,4000)];
  for(const s of sources){
    let m=s.match(/(?:^|\D)(\d{1,2})[.\/-](\d{1,2})[.\/-](20\d{2})(?:\D|$)/);
    if(m){
      const dd=String(m[1]).padStart(2,'0'),mm=String(m[2]).padStart(2,'0');
      return `${m[3]}-${mm}-${dd}`;
    }
    m=s.match(/(?:^|\D)(20\d{2})[.\/-](\d{1,2})[.\/-](\d{1,2})(?:\D|$)/);
    if(m){
      const mm=String(m[2]).padStart(2,'0'),dd=String(m[3]).padStart(2,'0');
      return `${m[1]}-${mm}-${dd}`;
    }
  }
  return state.date;
}
function inferSalesNetFromArithmetic(text,cancel,discount){
  const vals=moneyTokens(text).filter(x=>x>=50);
  let best=0,bestErr=Infinity;
  if(cancel>0&&discount>0){
    for(const a of vals)for(const b of vals)for(const c of vals){
      if(a<=b||b<=c)continue;
      const err=Math.abs((a-cancel)-b)+Math.abs((b-discount)-c);
      if(err<bestErr&&err<3){bestErr=err;best=c}
    }
  }
  if(!best&&discount>0){
    for(const a of vals)for(const b of vals){
      if(a<=b)continue;
      const err=Math.abs((a-discount)-b);
      if(err<bestErr&&err<2){bestErr=err;best=b}
    }
  }
  return best;
}
function extractExpenseCategories(text,expenseTotal=0,reportType='general'){
  const lines=String(text||'').split(/\n+/).map(x=>x.replace(/\s+/g,' ').trim()).filter(Boolean);
  const exclude=['toplam','net satış','net satis','satış','satis','indirim','iptal','nakit','kredi kart','online ödeme','online odeme','iban','yemeksepeti','trendyol','migros','adisyon','paket'];
  const preferred=['personel','maaş','maas','market','somun','kira','elektrik','su','doğalgaz','dogalgaz','reklam','vergi','bakım','bakim','malzeme','kurye','temizlik'];
  const out=[];
  for(const line of lines){
    const a=lineAmount(line);if(!a)continue;
    const nl=norm(line),isPreferred=preferred.some(k=>nl.includes(norm(k)));
    if(!isPreferred&&reportType!=='expense')continue;
    if(exclude.some(k=>nl.includes(norm(k)))&&!isPreferred)continue;
    const label=line.replace(/\d{1,3}(?:[.\s]\d{3})*(?:,\d{2})|\d+(?:,\d{2})/g,'').replace(/[₺:;|=\-]+/g,' ').replace(/\s+/g,' ').trim();
    if(!label||label.length<2)continue;
    if(expenseTotal&&a>expenseTotal*1.05)continue;
    out.push({category:label.slice(0,60),amount:a});
  }
  const unique=new Map();
  for(const x of out){const k=norm(x.category);if(!unique.has(k))unique.set(k,x)}
  return [...unique.values()];
}
function parseDailyReportText(text,fileName,method,pageCount){

  const grossBeforeCancel=findAmountByLabels(text,['iptal öncesi satış','iptal oncesi satis','brüt satış','brut satis']);
  let grossAfterCancel=findAmountByLabels(text,['iptal sonrası satış','iptal sonrasi satis']);
  const adisyonCount=findCountByLabels(text,['adisyon sayısı','adisyon sayisi']);
  const paketCount=findCountByLabels(text,['paket sayısı','paket sayisi']);
  const paymentDistribution={

    online:findAmountByLabels(text,['online ödeme','online odeme','online toplam'])
  };
  let expenseCategories=extractExpenseCategories(text,expenseTotal,reportType);

  if(reportType==='expense'){
    if(!expenseTotal&&expenseCategories.length)expenseTotal=expenseCategories.reduce((a,x)=>a+n(x.amount),0);
    salesNet=0;
  }else{
    if(!salesNet)salesNet=inferSalesNetFromArithmetic(text,cancel,discount);
    if(!grossAfterCancel&&grossBeforeCancel&&cancel)grossAfterCancel=Math.max(0,grossBeforeCancel-cancel);
    if(!salesNet&&grossAfterCancel&&discount)salesNet=Math.max(0,grossAfterCancel-discount);
  }

  let score=.25;
  if(reportType==='expense'&&expenseTotal>0)score+=.35;
  if(reportType!=='expense'&&salesNet>0)score+=.34;
  if(cancel>0)score+=.07;
  if(discount>0)score+=.07;
  if(adisyonCount>0||paketCount>0)score+=.07;
  if(expenseCategories.length)score+=.08;
  if(method==='PDF metni')score+=.05;
  score=Math.min(.98,score);

  return {
    pendingId:uid(),
    date:dateFromReport(fileName,text),
    branch:branch(),
    reportType,fileName,
    salesNet,cancel,discount,expenseTotal,
    grossBeforeCancel,grossAfterCancel,
    adisyonCount,paketCount,
    paymentDistribution,
    expenseCategories,
    status:'aktif',
    importedAt:now(),
    analysisMethod:method,
    analysisConfidence:score,
    pageCount,
    rawTextExcerpt:String(text||'').slice(0,2200)
  };
}
async function getPdfJs(){
  if(window.__kasamPdfJs)return window.__kasamPdfJs;
  const pdfjs=await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@6.3.289/build/pdf.min.mjs');
  pdfjs.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@6.3.289/build/pdf.worker.min.mjs';
  window.__kasamPdfJs=pdfjs;
  return pdfjs;
}
function loadExternalScript(src,testFn){
  return new Promise((resolve,reject)=>{
    if(testFn&&testFn())return resolve();
    const old=[...document.scripts].find(s=>s.src===src);
    if(old){
      old.addEventListener('load',()=>resolve(),{once:true});
      old.addEventListener('error',reject,{once:true});
      return;
    }
    const s=document.createElement('script');
    s.src=src;s.async=true;s.onload=()=>resolve();s.onerror=()=>reject(new Error('OCR kütüphanesi yüklenemedi'));
    document.head.appendChild(s);
  });
}
async function getTesseract(){
  if(window.Tesseract)return window.Tesseract;
  await loadExternalScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js',()=>!!window.Tesseract);
  return window.Tesseract;
}
function setPdfProgress(text,percent=0){
  state.pdfProgress=text;
  const wrap=$('pdfProgressWrap'),label=$('pdfProgressText'),fill=$('pdfProgressFill');
  if(wrap)wrap.classList.remove('hidden');
  if(label)label.textContent=text;
  if(fill)fill.style.width=Math.max(0,Math.min(100,percent))+'%';
}
async function createOcrWorker(){
  const T=await getTesseract();
  const logger=m=>{
    if(m.status==='recognizing text'){
      const p=Math.round((m.progress||0)*100);
      const fill=$('pdfProgressFill');if(fill)fill.style.width=(45+Math.round(p*.5))+'%';
    }
  };
  try{return await T.createWorker(['tur','eng'],1,{logger})}
  catch{return await T.createWorker('eng',1,{logger})}
}
async function extractPdfText(file,getOcrWorker){
  const pdfjs=await getPdfJs();
  const data=new Uint8Array(await file.arrayBuffer());
  const pdf=await pdfjs.getDocument({data}).promise;
  let text='';
  for(let i=1;i<=pdf.numPages;i++){
    setPdfProgress(`${file.name}: metin katmanı okunuyor (${i}/${pdf.numPages})`,Math.round((i/pdf.numPages)*35));
    const page=await pdf.getPage(i),content=await page.getTextContent();
    text+=content.items.map(x=>x.str).join(' ')+'\n';
  }
  const compact=text.replace(/\s+/g,' ').trim();
  if(compact.length>=Math.max(140,pdf.numPages*55))return {text,method:'PDF metni',pageCount:pdf.numPages};

  setPdfProgress(`${file.name}: görsel PDF algılandı — OCR başlıyor`,40);
  const worker=await getOcrWorker();
  let ocr='';
  for(let i=1;i<=pdf.numPages;i++){
    setPdfProgress(`${file.name}: OCR sayfa ${i}/${pdf.numPages}`,40+Math.round(((i-1)/pdf.numPages)*55));
    const page=await pdf.getPage(i),viewport=page.getViewport({scale:1.8});
    const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});
    canvas.width=Math.ceil(viewport.width);canvas.height=Math.ceil(viewport.height);
    await page.render({canvasContext:ctx,viewport}).promise;
    const ret=await worker.recognize(canvas);
    ocr+=(ret?.data?.text||'')+'\n';
  }
  return {text:ocr,method:'OCR',pageCount:pdf.numPages};
}
async function analyzeDailyPdfFiles(files){
  const list=[...files].filter(f=>f.type==='application/pdf'||f.name.toLowerCase().endsWith('.pdf'));
  if(!list.length)return toast('PDF dosyası seç',true);
  if(state.pdfBusy)return toast('Bir PDF analizi zaten çalışıyor',true);
  state.pdfBusy=true;state.pdfProgress='PDF hazırlanıyor';render();

  let ocrWorker=null;
  const getOcrWorker=async()=>ocrWorker||(ocrWorker=await createOcrWorker());
  try{
    for(let i=0;i<list.length;i++){
      const file=list[i];
      setPdfProgress(`${file.name}: analiz başlıyor (${i+1}/${list.length})`,4);
      try{
        const extracted=await extractPdfText(file,getOcrWorker);
        const parsed=parseDailyReportText(extracted.text,file.name,extracted.method,extracted.pageCount);
        state.pendingReports.push(parsed);
        setPdfProgress(`${file.name}: analiz tamamlandı`,100);
      }catch(err){
        console.error(err);
        toast(`${file.name} analiz edilemedi: ${String(err?.message||err).slice(0,100)}`,true);
      }
    }
  }finally{
    if(ocrWorker)try{await ocrWorker.terminate()}catch{}
    state.pdfBusy=false;state.pdfProgress='';render();
  }
}

function saveHighConfidencePending(){

function effectiveRecipeRows(db,product,date){
  const canonical=canonicalProduct(db,product),all=active(db.recipes).filter(x=>x.branch===branch()&&norm(x.product)===norm(canonical)&&x.effectiveFrom<=date);
  const map=new Map();
  for(const r of all){const k=norm(r.component),prev=map.get(k);if(!prev||r.effectiveFrom>prev.effectiveFrom||(r.effectiveFrom===prev.effectiveFrom&&recordOrder(r)>recordOrder(prev)))map.set(k,r)}
  return [...map.values()].filter(x=>n(x.qty)>0);
}
function theoreticalStockUsage(db,date=state.date){
  const sold=active(db.quantities).filter(x=>x.date===date&&x.branch===branch()),map=new Map();
  for(const q of sold){
    for(const r of effectiveRecipeRows(db,q.product,date)){
      const c=latestComponent(db,r.component,date),targetUnit=c?.unit||r.unit,converted=convert(r.qty,r.unit,targetUnit);
      if(converted===null)continue;
      const qty=n(q.qty)*converted*(1+n(r.wastagePct||0)/100),key=norm(r.component);
      const prev=map.get(key)||{component:r.component,unit:targetUnit,qty:0};prev.qty+=qty;map.set(key,prev);
    }
  }
  return [...map.values()];
}
function stockBalance(db,component,date=state.date){
  const c=latestComponent(db,component,date),moves=active(db.stockMoves).filter(x=>x.branch===branch()&&norm(x.component)===norm(component)&&x.date<=date);
  const unit=c?.unit||moves[0]?.unit||'adet';
  let balance=0,unconverted=false;
  for(const m of moves){
    const q=convert(m.qty,m.unit,unit);
    if(q===null){unconverted=true;continue}
    const sign=(m.type==='giriş'||m.type==='düzeltme_artı')?1:-1;balance+=sign*q;
  }
  return {balance,unit,unconverted};
}
function stockPage(){
  const db=load(),names=[...new Set([...active(db.componentCosts).filter(x=>x.branch===branch()).map(x=>x.component),...active(db.stockMoves).filter(x=>x.branch===branch()).map(x=>x.component)])].sort((a,b)=>a.localeCompare(b,'tr'));
  const usage=theoreticalStockUsage(db,state.date),usageMap=new Map(usage.map(x=>[norm(x.component),x]));
  const body=names.map(name=>{const sb=stockBalance(db,name,state.date),u=usageMap.get(norm(name));const after=sb.balance-(u?convert(u.qty,u.unit,sb.unit)||0:0);return `<tr><td>${esc(name)}</td><td>${sb.balance.toFixed(3)} ${esc(sb.unit)}</td><td>${u?`${n(convert(u.qty,u.unit,sb.unit)||0).toFixed(3)} ${esc(sb.unit)}`:'-'}</td><td>${after.toFixed(3)} ${esc(sb.unit)}</td><td>${after<0?'<span class="badge bad-badge">EKSİK STOK</span>':'<span class="badge ok">OK</span>'}</td></tr>`}).join('');
  const moves=active(db.stockMoves).filter(x=>x.branch===branch()&&x.date===state.date).slice().reverse();

function reportCashAmount(r){
  const p=r?.paymentDistribution||{};
  return n(p.nakit||p['Nakit']||0);
}
function cashFlowDay(db,date=state.date){
  const r=resolveReports(db,date),reportCash=reportCashAmount(r);
  const customerCash=active(db.customerTx).filter(x=>x.branch===branch()&&x.date===date&&x.type==='tahsilat'&&x.paymentMethod==='nakit').reduce((a,x)=>a+n(x.amount),0);
  const employeeCash=active(db.employeeTx).filter(x=>x.branch===branch()&&x.date===date&&(x.type==='ödeme'||x.type==='avans')&&x.paymentMethod==='nakit').reduce((a,x)=>a+n(x.amount),0);
  const supplierCash=active(db.supplierTx).filter(x=>x.branch===branch()&&x.date===date&&x.type==='ödeme'&&x.paymentMethod==='nakit').reduce((a,x)=>a+n(x.amount),0);
  const expenseCash=active(db.extraExpenses).filter(x=>x.branch===branch()&&x.date===date&&x.paymentMethod==='nakit').reduce((a,x)=>a+n(x.amount),0);
  const manualIn=active(db.cashMoves).filter(x=>x.branch===branch()&&x.date===date&&x.type==='giriş').reduce((a,x)=>a+n(x.amount),0);
  const manualOut=active(db.cashMoves).filter(x=>x.branch===branch()&&x.date===date&&x.type==='çıkış').reduce((a,x)=>a+n(x.amount),0);
  const netMovement=reportCash+customerCash+manualIn-employeeCash-supplierCash-expenseCash-manualOut;
  return {reportCash,customerCash,employeeCash,supplierCash,expenseCash,manualIn,manualOut,netMovement};
}

function closeCurrentDay(){
  const db=load();if(getClosing(db,state.date,branch()))return toast('Gün zaten kapalı',true);
  const c=calcDay(state.date),ready=!!c.r.sales&&c.qty.length>0&&c.missing.length===0&&c.unclassifiedExpense===0&&c.expenseCategoryOverage<=.5;
  if(!ready)return toast('Kapanış için eksik verileri tamamla',true);
  if(!confirm(`${state.date} günü kapatılsın ve kayıtlar kilitlensin mi?`))return;
  const closingId=uid(),usage=theoreticalStockUsage(db,state.date),stockPosted=[];
  if(db.settings?.autoStockOnClose!==false){
    for(const u of usage){
      const tracked=active(db.stockMoves).some(x=>x.branch===branch()&&norm(x.component)===norm(u.component)&&x.date<=state.date);
      if(!tracked)continue;
      db.stockMoves.push({id:uid(),date:state.date,branch:branch(),component:u.component,type:'teorik_tüketim',qty:u.qty,unit:u.unit,note:'Günlük kapanış reçete tüketimi',status:'aktif',createdAt:now(),auto:true,sourceClosingId:closingId});
      stockPosted.push({component:u.component,qty:u.qty,unit:u.unit});
    }
  }
  const cf=cashFlowDay(db,state.date),check=active(db.cashChecks).filter(x=>x.branch===branch()&&x.date===state.date).sort((a,b)=>(b.at||'').localeCompare(a.at||''))[0];
  db.closings.push({
    id:closingId,date:state.date,branch:branch(),status:'aktif',closedAt:now(),closedBy:state.user?.name||'Yönetici',
    snapshot:{
      salesNet:c.r.salesNet,cogs:c.cogs,operating:c.cls.operating,unclassified:c.unclassifiedExpense,extra:c.extra,platform:c.platform,bank:c.bank,recurring:c.recurring,courier:c.courierAdd,employeeAdd:c.employeeAdd,
      trueProfit:c.trueProfit,trueMargin:c.trueMargin,quality:c.quality,
      customerReceivable:active(db.customers).filter(x=>x.branch===branch()).reduce((a,x)=>a+Math.max(0,customerBalance(db,x.id)),0),
      employeePayable:active(db.employees).filter(x=>x.branch===branch()).reduce((a,x)=>a+employeeBalance(db,x.id),0),
      supplierPayable:active(db.suppliers).filter(x=>x.branch===branch()).reduce((a,x)=>a+supplierBalance(db,x.id),0),
      cashTrackedMovement:cf.netMovement,cashVariance:check?(n(check.actualClose)-(n(check.openingCash)+cf.netMovement)):null,
      stockPosted
    }
  });
  db.audit.unshift({id:uid(),at:now(),user:state.user?.name||'Sistem',branch:branch(),action:`Gün kapatıldı: ${state.date}`});
  save(db);render();toast('Gün kapatıldı, snapshot alındı ve kayıtlar kilitlendi');
}

async function updateStorageStatus(){
  const el=$('storageStatus');if(!el)return;
  const bytes=new Blob([localStorage.getItem(KEY)||'']).size;
  let extra=`Ana veri yaklaşık ${(bytes/1024/1024).toFixed(2)} MB.`;
  if(navigator.storage?.estimate){
    try{const e=await navigator.storage.estimate();extra+=` Tarayıcı kullanımı ${(n(e.usage)/1024/1024).toFixed(1)} MB / ${(n(e.quota)/1024/1024).toFixed(0)} MB kota.`}catch{}
  }
  el.textContent=extra;
}

function smartParse(text){
  const out=[],lines=String(text||'').split(/\n|(?<=[.!?])\s+/).map(x=>x.trim()).filter(Boolean);
  const amount=t=>{const m=t.match(/(\d[\d.\s]*(?:,\d{1,2})?)\s*(?:tl|₺)/i);return m?n(m[1]):0}; const firstNumber=t=>{const m=String(t).match(/(\d[\d.]*?(?:,\d{1,2})?)(?=\s|$)/);return m?n(m[1]):0};
  const clean=s=>String(s||'').replace(/\b(?:bugün|bugun|aldım|aldim|alındı|alindi|için|icin|toplam|maliyet|masraf|kesinti|kesti|tutar|tl|geldi|geliyor)\b/gi,' ').replace(/\s+/g,' ').trim();
  for(const line of lines){
    const low=line.toLocaleLowerCase('tr-TR');
    if((low.includes('banka')||low.includes('pos'))&&(low.includes('kes')||low.includes('komisyon'))){const a=amount(line);if(a)out.push({type:'bank_fee',confidence:.98,data:{amount:a,note:line}});continue}
    if(low.includes('kurye')&&(low.includes('saat')||low.includes('pos')||low.includes('teslimat'))){const hours=n((line.match(/(\d+(?:[.,]\d+)?)\s*saat/i)||[])[1]),rate=n((line.match(/saatlik\s*(\d+(?:[.,]\d+)?)/i)||[])[1]),pos=n((line.match(/pos\s*(?:çekti|cekti|toplamı|toplami)?\s*(\d[\d.,]*)/i)||[])[1]),orders=n((line.match(/(\d+)\s*teslimat/i)||[])[1]),name=(line.match(/([A-Za-zÇĞİÖŞÜçğıöşü]+)\s+kurye/i)||[])[1]||'Kurye';out.push({type:'courier',confidence:.93,data:{name,hours,hourlyRate:rate,pos,orders,fixedPay:0,addToProfit:false}});continue}
    if(low.includes('sat')&&/\d+/.test(line)){const pairs=[...line.matchAll(/(\d+(?:[.,]\d+)?)\s+([A-Za-zÇĞİÖŞÜçğıöşü][A-Za-zÇĞİÖŞÜçğıöşü\s]*?)(?=\s+\d+|satt|$)/g)];if(pairs.length){for(const m of pairs){const product=clean(m[2]).replace(/\bsatt.*$/i,'').trim();if(product)out.push({type:'quantity',confidence:.91,data:{product,qty:n(m[1])}})}continue}}
    if(low.includes('porsiyon maliyeti')||low.includes('birim maliyet')||low.includes('tane maliyeti')){const a=amount(line),product=clean(line.split(/porsiyon maliyeti|birim maliyet|tane maliyeti/i)[0]);if(a&&product)out.push({type:'direct_cost',confidence:.97,data:{product,unitCost:a}});continue}
    const p=line.match(/(\d+(?:[.,]\d+)?)\s*(kg|gr|lt|ml|adet|tane|paket|koli)?\s*([A-Za-zÇĞİÖŞÜçğıöşü][A-Za-zÇĞİÖŞÜçğıöşü\s]*?)\s+(\d[\d.\s]*(?:,\d{1,2})?)\s*(?:tl|₺)/i);
    if(p&&(low.includes('ald')||low.includes('maliyet')||low.includes('geliyor')||low.includes('tutar')||low.includes('geldi'))){const quantity=n(p[1]),unit=(p[2]||'adet').toLocaleLowerCase('tr-TR'),component=clean(p[3]),totalCost=n(p[4]);if(quantity&&totalCost&&component)out.push({type:'component_cost',confidence:.97,data:{component,quantity,unit,totalCost,unitCost:totalCost/quantity}});continue}
    const rev=line.match(/^([A-Za-zÇĞİÖŞÜçğıöşü][A-Za-zÇĞİÖŞÜçğıöşü\s]*?)\s+(\d+(?:[.,]\d+)?)\s*(kg|gr|lt|ml|adet|tane|paket|koli|tanesi|adedi)?\s+(?:toplam\s+)?(\d[\d.\s]*(?:,\d{1,2})?)\s*(?:tl|₺)/i);
    if(rev){const component=clean(rev[1]),quantity=n(rev[2]),rawUnit=(rev[3]||'adet').toLocaleLowerCase('tr-TR'),unit=(rawUnit==='tanesi'||rawUnit==='adedi'||rawUnit==='tane')?'adet':rawUnit,totalCost=n(rev[4]);if(component&&quantity&&totalCost){out.push({type:'component_cost',confidence:(low.includes('ald')||low.includes('maliyet')||low.includes('geliyor'))?.95:.84,data:{component,quantity,unit,totalCost,unitCost:totalCost/quantity}});continue}}
    if(p){const quantity=n(p[1]),unit=((p[2]||'adet').toLocaleLowerCase('tr-TR')==='tane'?'adet':(p[2]||'adet').toLocaleLowerCase('tr-TR')),component=clean(p[3]),totalCost=n(p[4]);if(quantity&&totalCost&&component){out.push({type:'component_cost',confidence:.84,data:{component,quantity,unit,totalCost,unitCost:totalCost/quantity}});continue}}
    if((low.includes('alacağı var')||low.includes('alacagi var')) && (amount(line)||firstNumber(line))){
      const a=amount(line)||firstNumber(line);
      let first=(line.match(/^([A-Za-zÇĞİÖŞÜçğıöşü'’]+)/)||[])[1]||'';
      if(/['’](?:nin|nın|nun|nün|in|ın|un|ün)$/i.test(first))first=first.replace(/['’](?:nin|nın|nun|nün|in|ın|un|ün)$/i,'');
      else if(first.length>=7)first=first.replace(/(?:nin|nın|nun|nün|in|ın|un|ün)$/i,'');
      if(first)out.push({type:'customer_debt',confidence:.72,data:{name:first,amount:a,note:line}});
      continue;
    }
    if(!low.includes('tedarikçi')&&!low.includes('tedarikci')&&(low.includes('veresiye')||low.includes('borç')||low.includes('borc')||low.includes('bakiye')) && amount(line)){
      const a=amount(line);
      const m=line.match(/^([A-Za-zÇĞİÖŞÜçğıöşü][A-Za-zÇĞİÖŞÜçğıöşü\s]*?)\s+(?:için\s+|icin\s+)?(?:\d|.*?\d)/i);
      let name=(m?.[1]||line.split(/\d/)[0]).replace(/\b(?:müşteri|musteri|veresiye|borç|borc|bakiye|yaz|ekle|tl)\b/gi,' ').trim();
      if(name)out.push({type:'customer_debt',confidence:.94,data:{name,amount:a,note:line}});
      continue;
    }
    if((/(^|\s)(ödedi|odedi)(?=\s|$)/i.test(low)||low.includes('tahsilat')||low.includes('ödeme yaptı')||low.includes('odeme yapti')) && (amount(line)||firstNumber(line))){
      const explicit=amount(line),a=explicit||firstNumber(line);
      let name=line.split(/\d/)[0].replace(/\b(?:müşteri|musteri|ödedi|odedi|tahsilat|ödeme|odeme|yaptı|yapti|tl)\b/gi,' ').trim();
      if(name)out.push({type:'customer_payment',confidence:explicit?.94:.78,data:{name,amount:a,note:line}});
      continue;
    }
    if((low.includes('hakediş')||low.includes('hakedis')||low.includes('emanet maaş')||low.includes('emanet maas')||low.includes('avans')) && (amount(line)||firstNumber(line))){
      const a=amount(line)||firstNumber(line),movement=(low.includes('emanet')?'emanet':low.includes('avans')?'avans':'hakediş');
      let name=line.split(/\d/)[0].replace(/\b(?:personel|çalışan|calisan|hakediş|hakedis|emanet|maaş|maas|avans|tl)\b/gi,' ').trim();
      if(name)out.push({type:'employee_tx',confidence:amount(line)?.86:.74,data:{name,movement,amount:a,note:line}});
      continue;
    }
    if((low.includes('tedarikçi')||low.includes('tedarikci')) && (amount(line)||firstNumber(line))){
      const a=amount(line)||firstNumber(line),movement=(low.includes('öd')||low.includes('ode'))?'ödeme':'borç';
      let name=line.replace(/\b(?:tedarikçi|tedarikci)\b/gi,' ').split(/\d/)[0].replace(/\b(?:borç|borc|ödeme|odeme|ödedim|odedim|tl)\b/gi,' ').trim();
      if(name)out.push({type:'supplier_tx',confidence:amount(line)?.84:.72,data:{name,movement,amount:a,note:line}});
      continue;
    }
    if((low.includes('yemeksepeti')||low.includes('trendyol')||low.includes('migros')) && (low.includes('komisyon')||low.includes('reklam')||low.includes('taşıma')||low.includes('tasima')||low.includes('kesinti'))){
      const a=amount(line)||firstNumber(line);if(a){const platform=low.includes('yemeksepeti')?'Yemeksepeti':low.includes('trendyol')?'Trendyol':'Migros';out.push({type:'platform_cost',confidence:amount(line)?.96:.8,data:{platform,amount:a,note:line}});continue}
    }
    if(low.includes('gider')||low.includes('ödedim')||low.includes('odedim')||low.includes('masraf')){const a=amount(line)||firstNumber(line);if(a){let category=line.split(/\d/)[0].replace(/\b(?:bugün|bugun|gider|masraf|ödedim|odedim|tl)\b/gi,' ').trim()||'Diğer';out.push({type:'expense',confidence:amount(line)?.86:.72,data:{category,amount:a,note:line}})}}
  }
  return out;
}
function smartDesc(x){
  if(x.type==='component_cost')return `${x.data.component}: ${x.data.quantity} ${x.data.unit} / ${money(x.data.totalCost)} → ${money(x.data.unitCost)} / ${x.data.unit}`;
  if(x.type==='bank_fee')return `Banka/POS kesintisi: ${money(x.data.amount)}`;
  if(x.type==='quantity')return `${x.data.product}: ${x.data.qty} adet`;
  if(x.type==='direct_cost')return `${x.data.product}: ${money(x.data.unitCost)} birim maliyet`;
  if(x.type==='courier')return `${x.data.name}: ${x.data.hours} saat · POS ${money(x.data.pos)} · ${x.data.orders} teslimat`;
  if(x.type==='expense')return `${x.data.category||'Gider'}: ${money(x.data.amount)}`; if(x.type==='platform_cost')return `${x.data.platform}: ${money(x.data.amount)} platform kesintisi`;
  if(x.type==='customer_debt')return `${x.data.name}: ${money(x.data.amount)} veresiye/borç`;
  if(x.type==='customer_payment')return `${x.data.name}: ${money(x.data.amount)} tahsilat`;
  if(x.type==='employee_tx')return `${x.data.name}: ${money(x.data.amount)} personel ${x.data.movement}`;
  if(x.type==='supplier_tx')return `${x.data.name}: ${money(x.data.amount)} tedarikçi ${x.data.movement}`;
  return x.type;
}
function applySmart(x){if(!requireOpenDay(state.date,branch()))return false;
  const db=load(),b=branch(),d=state.date;
  const fp=d+'|'+b+'|'+x.type+'|'+JSON.stringify(x.data);
  const recent=(db.audit||[]).find(a=>a.smartFingerprint===fp && (Date.now()-new Date(a.at).getTime())<120000);
  if(recent){toast('Aynı akıllı kayıt son 2 dakika içinde zaten işlendi',true);return false}
  if(x.type==='component_cost'){db.componentCosts.push({id:uid(),branch:b,effectiveFrom:d,status:'aktif',createdAt:now(),...x.data});db.stockMoves.push({id:uid(),date:d,branch:b,component:x.data.component,type:'giriş',qty:x.data.quantity,unit:x.data.unit,note:`Akıllı alış: ${money(x.data.totalCost)}`,status:'aktif',createdAt:now(),auto:false});}
  else if(x.type==='bank_fee')db.bankFees.push({id:uid(),date:d,branch:b,bank:'Banka/POS',status:'aktif',...x.data});
  else if(x.type==='quantity'){const product=canonicalProduct(db,x.data.product);db.quantities.push({id:uid(),date:d,branch:b,status:'aktif',...x.data,product});}
  else if(x.type==='direct_cost')db.directCosts.push({id:uid(),branch:b,effectiveFrom:d,status:'aktif',createdAt:now(),...x.data});
  else if(x.type==='courier')db.couriers.push({id:uid(),date:d,branch:b,status:'aktif',...x.data});
  else if(x.type==='expense')db.extraExpenses.push({id:uid(),date:d,branch:b,status:'aktif',...x.data}); else if(x.type==='platform_cost')db.platformCosts.push({id:uid(),date:d,branch:b,status:'aktif',...x.data});
  else if(x.type==='customer_debt' || x.type==='customer_payment'){
    let c=findCustomerByName(db,x.data.name,b);
    if(!c){c={id:uid(),branch:b,name:x.data.name,phone:'',note:'Akıllı girişten otomatik oluşturuldu',status:'aktif',createdAt:now()};db.customers.push(c)}
    db.customerTx.push({id:uid(),customerId:c.id,branch:b,date:d,type:x.type==='customer_debt'?'borç':'tahsilat',amount:x.data.amount,paymentMethod:'belirsiz',note:x.data.note||'',status:'aktif',at:now()});
  }
  else if(x.type==='employee_tx'){
    let e=active(db.employees).find(z=>z.branch===b&&norm(z.name)===norm(x.data.name));
    if(!e){e={id:uid(),branch:b,name:x.data.name,phone:'',note:'Akıllı girişten otomatik oluşturuldu',status:'aktif',createdAt:now()};db.employees.push(e)}
    db.employeeTx.push({id:uid(),employeeId:e.id,branch:b,date:d,type:x.data.movement,amount:x.data.amount,paymentMethod:'belirsiz',addToProfit:false,note:x.data.note||'',status:'aktif',at:now()});
  }
  else if(x.type==='supplier_tx'){
    let s=active(db.suppliers).find(z=>z.branch===b&&norm(z.name)===norm(x.data.name));
    if(!s){s={id:uid(),branch:b,name:x.data.name,phone:'',note:'Akıllı girişten otomatik oluşturuldu',status:'aktif',createdAt:now()};db.suppliers.push(s)}
    db.supplierTx.push({id:uid(),supplierId:s.id,branch:b,date:d,type:x.data.movement,amount:x.data.amount,paymentMethod:'belirsiz',note:x.data.note||'',status:'aktif',at:now()});
  }
  else return false;
  db.audit.unshift({id:uid(),at:now(),user:state.user?.name||'Sistem',branch:b,action:`Akıllı giriş: ${smartDesc(x)}`,smartFingerprint:fp});
  save(db);return true;
}
function smartProcess(){
  const text=$('smartText').value.trim();if(!text)return toast('Bir işlem yaz',true);
  const parsed=smartParse(text);const box=$('smartResult');box.classList.remove('hidden');
  if(!parsed.length){box.innerHTML='<div class="callout warnc"><strong>Anlayamadım.</strong> Daha açık yaz. Örnek: “100 ambalaj 1000 TL aldım”.</div>';return}
  const auto=$('autoApply').checked,applied=[];
  for(const x of parsed)if(auto&&x.confidence>=.94&&applySmart(x))applied.push(x);
  box.innerHTML=`<div class="smart-preview">${parsed.map((x,i)=>`<div class="smart-item"><div><strong>${esc(smartDesc(x))}</strong><div class="hint">Güven %${Math.round(x.confidence*100)}</div></div>${applied.includes(x)?'<span class="badge ok">KAYDEDİLDİ</span>':`<button class="ghost mini" data-smart="${i}">Kaydet</button>`}</div>`).join('')}</div>`;
  document.querySelectorAll('[data-smart]').forEach(b=>b.onclick=()=>{const x=parsed[Number(b.dataset.smart)];if(applySmart(x)){b.outerHTML='<span class="badge ok">KAYDEDİLDİ</span>';render()}});
  if(applied.length){$('smartText').value='';render()}
}

async function importAIJsonFile(file){
  try{
    const x=JSON.parse(await file.text());if(!x||!x.date||!Array.isArray(x.reports))throw new Error();
    const db=load(),b=x.branch||branch();if(!requireOpenDay(x.date,b))return;
    for(const r of x.reports){const fp=[x.date,b,r.reportType,r.fileName||'',r.salesNet||0,r.expenseTotal||0].join('|');if(db.reportImports.some(z=>z.fingerprint===fp&&z.status!=='iptal'))continue;db.reportImports.push({id:uid(),date:x.date,branch:b,status:'aktif',importedAt:now(),fingerprint:fp,...r})}
    if(Array.isArray(x.quantities))for(const q of x.quantities){const product=canonicalProduct(db,q.product),fp=[x.date,b,norm(product),n(q.qty),'ai'].join('|');if(db.quantities.some(z=>z.status!=='iptal'&&z.importFingerprint===fp))continue;db.quantities.push({id:uid(),date:x.date,branch:b,status:'aktif',source:'ai_import',importFingerprint:fp,...q,product});}
    save(db);state.date=x.date;if(state.user.role==='admin')state.branch=b;audit(`AI analiz içe aktarıldı: ${x.date}`);render();toast('AI analiz kaydı içe aktarıldı');
  }catch{toast('JSON formatı uygun değil',true)}
}
function exportHistory(){
  const rows=[['Tarih','Şube','Net Satış','Ürün Maliyeti','Ek Gider','Platform','Banka','Sabit Gider','Kâr Tahmini','Güven']];
  for(let i=0;i<31;i++){const d=new Date(state.date+'T12:00:00');d.setDate(d.getDate()-i);const ds=d.toISOString().slice(0,10),c=calcDay(ds);if(c.r.sales||c.qty.length||c.r.expenseTotal)rows.push([ds,branch(),c.r.salesNet,c.cogs,c.extra,c.platform,c.bank,c.recurring,c.trueProfit,c.quality])}
  const csv='\ufeff'+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(';')).join('\n');download(`kasam-net-${branch()}-${state.date}.csv`,csv,'text/csv;charset=utf-8');
}

function bind(){
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>softDelete(b.dataset.del,b.dataset.id)); document.querySelectorAll('[data-remove-recipe]').forEach(b=>b.onclick=()=>removeRecipeComponent(b.dataset.removeRecipe));
  const mr=$('manualReport');if(mr)mr.onclick=reportModal;
  const ia=$('importAIJson');if(ia)ia.onclick=()=>$('aiJsonInput').click();
  const pick=$('pickDailyPdf'),pdfInput=$('dailyPdfInput'),drop=$('reportDrop');
  if(pick&&pdfInput){pick.onclick=()=>pdfInput.click();pdfInput.onchange=e=>{if(e.target.files?.length)analyzeDailyPdfFiles(e.target.files)}}
  if(drop){
    drop.onclick=()=>pdfInput?.click();
    ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('drag')}));
    ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('drag')}));
    drop.addEventListener('drop',e=>{if(e.dataTransfer?.files?.length)analyzeDailyPdfFiles(e.dataTransfer.files)});
  }
  document.querySelectorAll('[data-save-pending]').forEach(b=>b.onclick=()=>savePendingReport(b.dataset.savePending));
  document.querySelectorAll('[data-edit-pending]').forEach(b=>b.onclick=()=>editPendingReport(b.dataset.editPending));
  document.querySelectorAll('[data-drop-pending]').forEach(b=>b.onclick=()=>{state.pendingReports=state.pendingReports.filter(x=>x.pendingId!==b.dataset.dropPending);render()});
  document.querySelectorAll('[data-view-report]').forEach(b=>b.onclick=()=>viewReportModal(b.dataset.viewReport));
  const shc=$('saveHighConfidence');if(shc)shc.onclick=saveHighConfidencePending;
  const nc=$('newComponent');if(nc)nc.onclick=componentModal;
  const nr=$('newRecipe');if(nr)nr.onclick=recipeModal;
  const nd=$('newDirectCost');if(nd)nd.onclick=directCostModal; const na=$('newAlias');if(na)na.onclick=aliasModal;
  const nq=$('newQty');if(nq)nq.onclick=qtyModal;
  const ncu=$('newCustomer');if(ncu)ncu.onclick=()=>customerModal();
  document.querySelectorAll('[data-customer-edit]').forEach(b=>b.onclick=()=>customerModal(b.dataset.customerEdit));
  document.querySelectorAll('[data-customer-move]').forEach(b=>b.onclick=()=>customerMoveModal(b.dataset.customerMove));
  const nem=$('newEmployee');if(nem)nem.onclick=()=>employeeModal();document.querySelectorAll('[data-employee-edit]').forEach(b=>b.onclick=()=>employeeModal(b.dataset.employeeEdit));document.querySelectorAll('[data-employee-move]').forEach(b=>b.onclick=()=>employeeMoveModal(b.dataset.employeeMove));
  const nsu=$('newSupplier');if(nsu)nsu.onclick=()=>supplierModal();document.querySelectorAll('[data-supplier-edit]').forEach(b=>b.onclick=()=>supplierModal(b.dataset.supplierEdit));document.querySelectorAll('[data-supplier-move]').forEach(b=>b.onclick=()=>supplierMoveModal(b.dataset.supplierMove));
  const nsm=$('newStockMove');if(nsm)nsm.onclick=stockMoveModal;
  const ncc=$('newCashCheck');if(ncc)ncc.onclick=cashCheckModal;const ncm=$('newCashMove');if(ncm)ncm.onclick=cashMoveModal;
  const closeBtn=$('closeDay');if(closeBtn)closeBtn.onclick=closeCurrentDay;const reopenBtn=$('reopenDay');if(reopenBtn)reopenBtn.onclick=reopenCurrentDay;
  const ecu=$('exportCustomers');if(ecu)ecu.onclick=exportCustomerStatement;
  document.querySelectorAll('[data-expense-rule]').forEach(b=>b.onclick=()=>expenseRuleModal(b.dataset.expenseRule));
  const ne=$('newExpense');if(ne)ne.onclick=()=>simpleExpenseModal('expense');
  const np=$('newPlatform');if(np)np.onclick=()=>simpleExpenseModal('platform');
  const nb=$('newBank');if(nb)nb.onclick=()=>simpleExpenseModal('bank');
  const nrg=$('newRecurring');if(nrg)nrg.onclick=()=>simpleExpenseModal('recurring');
  const nk=$('newCourier');if(nk)nk.onclick=courierModal;
  const eh=$('exportHistory');if(eh)eh.onclick=exportHistory;
  const ss=$('saveSettings');if(ss)ss.onclick=()=>{const dbs=load();dbs.settings={...(dbs.settings||{}),targetMargin:n($('setTargetMargin').value)||20,autoStockOnClose:$('setAutoStock')?.checked!==false};save(dbs);audit('Ayarlar güncellendi');render();toast('Ayar kaydedildi')};
  const ps=$('persistStorage');if(ps)ps.onclick=requestPersistentStorage;const rm=$('restoreMirror');if(rm)rm.onclick=restoreMirrorBackup;if($('storageStatus'))updateStorageStatus();
  const db=$('downloadBackup');if(db)db.onclick=()=>download(`kasam-net-yedek-${state.date}.json`,JSON.stringify(load(),null,2));
  const rb=$('restoreBackup');if(rb)rb.onclick=()=>$('backupFile').click();
  const bf=$('backupFile');if(bf)bf.onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const x=JSON.parse(await f.text());if(!confirm('Mevcut verinin üzerine yedek yüklensin mi?'))return;localStorage.setItem(KEY+'_pre_restore',JSON.stringify(load()));save({...blank(),...x});audit('Yedek geri yüklendi');render();toast('Yedek yüklendi')}catch{toast('Geçersiz yedek',true)}};
}

$('loginBtn').onclick=()=>{
  const u=USERS.find(x=>x.username===$('loginUser').value.trim()&&x.password===$('loginPass').value);
  if(!u)return toast('Kullanıcı adı veya şifre hatalı',true);
  state.user={username:u.username,name:u.name,role:u.role,branch:u.branch};localStorage.setItem(SESSION,JSON.stringify(state.user));
  $('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=u.name;$('role').textContent=u.role==='admin'?'Yönetici':u.branch;if(u.branch)state.branch=u.branch;render();
};
